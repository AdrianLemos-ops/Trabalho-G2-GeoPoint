
<!DOCTYPE html>
<html lang="pt-BR">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>GeoPoint - Cadastro de Ponto</title>

    <link rel="stylesheet" href="style.css">
</head>

<body>

    <main class="container">

        <header class="cabecalho">
            <h1>GeoPoint</h1>
            <p>Cadastro e gerenciamento de pontos geográficos.</p>
        </header>

        <section class="conteudo escondido" id="secao-form">

            <h2 id="titulo">Novo ponto</h2>

            <div id="mensagem" class="escondido"></div>

            <form id="form-ponto" class="formulario" novalidate>

                <div id="campos"></div>

                <div class="acoes">
                    <button type="submit" id="btn-salvar" class="botao-novo">
                        Cadastrar
                    </button>

                    <a href="index.html">Cancelar</a>
                </div>

            </form>

        </section>

        <p id="carregando">Carregando formulário...</p>

    </main>

    <script src="api.js"></script>
    <script src="componentes.js"></script>
    <script src="formulario.js"></script>

</body>

</html>
