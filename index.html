
<!DOCTYPE html>
<html lang="pt-BR">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>GeoPoint</title>

    <link rel="stylesheet" href="style.css">
</head>

<body>

    <main class="container">

        <header class="cabecalho">
            <h1>GeoPoint</h1>
            <p>Cadastro e gerenciamento de pontos geográficos.</p>
        </header>

        <section class="conteudo">

            <h2>Meus pontos geográficos</h2>

            <button class="botao-novo">+ Novo Ponto</button>

            <table>
                <thead>
                    <tr>
                        <th>Nome</th>
                        <th>Descrição</th>
                        <th>Latitude</th>
                        <th>Longitude</th>
                        <th>Ações</th>
                    </tr>
                </thead>

                <tbody>
                    <tr>
                        <td colspan="5">Nenhum ponto cadastrado.</td>
                    </tr>
                </tbody>
            </table>

        </section>

    </main>

</body>

</html>
